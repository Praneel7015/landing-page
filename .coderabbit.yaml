language: en-US

reviews:
  profile: chill
  high_level_summary: true
  changed_files_summary: true
  poem: false
  review_status: true
  path_filters:
    - "!**/pnpm-lock.yaml"
    - "!out/**"
    - "!.next/**"
    - "!public/sitemap.xml"
    - "!public/rss.xml"
    - "!public/og/**"
    - "!CHANGELOG.md"
  path_instructions:
    - path: "pages/**/*.js"
      instructions: |
        Next.js 15 pages router, React 19, styled-jsx. Flag hook dependency
        bugs, hydration mismatches (Date, Math.random, window access during
        render), missing SEO props on new pages, and any secret that is not a
        NEXT_PUBLIC_ value reaching client code.
    - path: "components/**/*.js"
      instructions: |
        Shared layout and widgets. Check accessibility (labels, alt text,
        focus states, color contrast in both light and dark themes) and that
        third-party embeds (giscus, Cal.com, analytics) only load when their
        env vars are set.
    - path: "lib/{projects,clientWork}.js"
      instructions: |
        Portfolio data. Each entry needs title, url, description and tags.
        Flag broken or http:// links, typos, em dashes (the site avoids them)
        and descriptions that overstate what the linked repo does.
    - path: "blog/**/*.md"
      instructions: |
        Blog posts with gray-matter front matter. Check front matter fields
        match existing posts, links work, and code blocks have a language.
    - path: "scripts/**/*.mjs"
      instructions: Build-time sitemap and RSS generators. Output must stay valid XML with absolute URLs.
    - path: ".github/**"
      instructions: |
        Actions must stay pinned to full commit SHAs with a version comment,
        jobs should use least-privilege permissions, and checkout should set
        persist-credentials: false.
    - path: "lighthouserc.json"
      instructions: Assertions are warn-level on purpose while baselines settle; flag budgets loosened without a reason.
  pre_merge_checks:
    docstrings:
      mode: "off"
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "^main$"
  tools:
    eslint:
      enabled: true
    gitleaks:
      enabled: true
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: true

chat:
  auto_reply: true
